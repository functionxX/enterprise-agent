# K8s Service（备查）
# ClusterIP 内部服务 + 通过 Ingress 对外暴露（企业标准拓扑）
apiVersion: v1
kind: Service
metadata:
  name: enterprise-agent
  labels:
    app: enterprise-agent
spec:
  type: ClusterIP
  selector:
    app: enterprise-agent
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: metrics
      port: 8000
      targetPort: 8000
